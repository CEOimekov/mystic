<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start Code</title>
  <link rel="stylesheet" href="style.css?v=20260606-lock1" />
</head>
<body class="start-page">
  <header class="start-topbar">
    <button class="start-link start-link--help" type="button" id="helpNameBtn" aria-expanded="false" aria-controls="helpNamePanel">
      <span class="start-icon start-icon--help" aria-hidden="true">?</span>
      Help
    </button>
    <button class="start-link start-link--home" type="button">
      Return to Home
      <svg class="start-icon start-icon--home" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3 10.5L12 3l9 7.5" />
        <path d="M5 10v10h14V10" />
      </svg>
    </button>
  </header>

  <div id="helpNamePanel" class="help-name-panel" hidden>
    <div class="help-name-card" role="dialog" aria-modal="false" aria-labelledby="helpNameLabel">
      <label class="help-name-label" id="helpNameLabel" for="helpNameInput">Your name</label>
      <input id="helpNameInput" class="help-name-input" type="text" autocomplete="name" placeholder="Enter name" />
      <button id="helpNameSave" class="help-name-save" type="button">Save</button>
      <p id="helpNameStatus" class="help-name-status" aria-live="polite"></p>
    </div>
  </div>

  <main class="start-content">
    <h1 class="start-title">Start Code</h1>
    <p class="start-subtext">Enter your start code now to begin testing. Good luck!</p>
    <p class="start-subtext start-subtext--note">The start code contains <strong class="start-bold">numbers only</strong>.</p>

    <form id="codeForm" class="start-form" novalidate>
      <div class="code-inputs" role="group" aria-label="Start code">
        <input class="code-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" />
        <input class="code-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" />
        <input class="code-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" />
        <input class="code-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" />
        <input class="code-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" />
        <input class="code-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" />
      </div>
      <input id="accessCode" name="accessCode" type="hidden" />
      <button type="submit" class="start-button">Start Test</button>
      <p class="start-error" id="codeError" role="alert" hidden>Enter a 6-digit start code.</p>
    </form>

    <div class="start-footer">
      <span class="start-footer__icon" aria-hidden="true">
        <svg viewBox="0 0 42 48" focusable="false">
          <ellipse class="clipboard-shadow" cx="21" cy="43" rx="13.5" ry="3.1" />
          <path class="clipboard-paper" d="M8.5 8h25v35h-25z" />
          <path class="clipboard-edge clipboard-edge--left" d="M10 10h1.5v31H10z" />
          <path class="clipboard-edge clipboard-edge--right" d="M30.5 10H32v31h-1.5z" />
          <path class="clipboard-inner" d="M12.5 13h17v26h-17z" />
          <path class="clipboard-top" d="M16 8c.4-3.2 2.2-5 5-5s4.6 1.8 5 5h-3.2c-.2-.9-.8-1.4-1.8-1.4s-1.6.5-1.8 1.4H16Z" />
          <path class="clipboard-clip" d="M14.5 8.5h13c1.4 0 2.5 1.1 2.5 2.5v3.5H12V11c0-1.4 1.1-2.5 2.5-2.5Z" />
          <path class="clipboard-clip-shade" d="M12.5 13h17v2.5h-17z" />
          <path class="clipboard-dots" d="M16.5 19.5h.1M16.5 25.5h.1M16.5 31.5h.1M16.5 37.5h.1" />
          <path class="clipboard-line" d="M20.5 19.5h7M20.5 25.5h7M20.5 31.5h7M20.5 37.5h6" />
        </svg>
      </span>
      <span>
        You can <button class="start-footer__link" type="button">review the instructions</button><br>
        that the proctor reads aloud.
      </span>
    </div>
    <div class="sr-only" id="status" aria-live="polite">Waiting for code.</div>
  </main>
  <script src="question-data.js?v=20260606-lock1"></script>
  <script src="precheck/static/student-records.js?v=20260606-lock1"></script>
  <script src="precheck/static/access-control.js?v=20260606-lock1"></script>
  <script src="script.js?v=20260606-lock1"></script>
</body>
</html>
