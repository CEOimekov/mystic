<script>
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const toggleLine = document.getElementById('toggle-line');
    const loginError = document.getElementById('login-error');

    function cleanStudentName(value) {
        return (value || '').replace(/\s+/g, ' ').trim();
    }

    function compactLookupValue(value) {
        return String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function getStudentRecordByEmail(email) {
        const records = window.BLUEBOOK_STUDENT_RECORDS || {};
        const byEmail = records.byEmail || {};
        const storedEmail = String(email || '').replace(/\s+/g, '').trim().toLowerCase();
        const compactEmail = compactLookupValue(storedEmail);
        const compactEmailRecord = Object.keys(byEmail).find(function (recordEmail) {
            const compactRecordEmail = compactLookupValue(recordEmail);
            const compactRecordLocal = compactLookupValue(recordEmail.split('@')[0]);
            return compactEmail === compactRecordEmail ||
                (compactRecordLocal.length > 4 && compactEmail.startsWith(compactRecordLocal));
        });
        return byEmail[storedEmail] || byEmail[compactEmailRecord] || null;
    }

    function getStudentNameFromEmail(email) {
        const record = getStudentRecordByEmail(email);
        if (record && record.fullName) {
            return cleanStudentName(record.fullName);
        }
        return '';
    }

    function setLoginError(isVisible) {
        if (!loginError) return;
        loginError.style.display = isVisible ? 'block' : 'none';
        emailInput.style.borderColor = isVisible ? '#b00020' : '#777';
    }

    function validateForm() {
        if (emailInput.value.trim() !== '' && passwordInput.value.trim() !== '') {
            submitBtn.disabled = false;
            submitBtn.style.backgroundColor = '#fedb00';
            submitBtn.style.cursor = 'pointer';
        } else {
            submitBtn.disabled = true;
            submitBtn.style.opacity = '1';
            submitBtn.style.backgroundColor = '#f0f0f0';
            submitBtn.style.cursor = 'not-allowed';
        }
    }

    emailInput.addEventListener('input', validateForm);
    emailInput.addEventListener('input', function () {
        setLoginError(false);
    });
    passwordInput.addEventListener('input', validateForm);
    passwordInput.addEventListener('input', function () {
        setLoginError(false);
    });
    validateForm();

    togglePasswordBtn.addEventListener('click', function () {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleLine.style.display = 'none';
        } else {
            passwordInput.type = 'password';
            toggleLine.style.display = 'block';
        }
    });

	    document.getElementById('student-login-form').addEventListener('submit', function (event) {
	        event.preventDefault();
	        var email = emailInput.value.trim();
	        if (email === '' || passwordInput.value.trim() === '') return;
	        var studentName = getStudentNameFromEmail(email);
	        if (!studentName) {
	            setLoginError(true);
	            emailInput.focus();
	            return;
	        }
	        localStorage.setItem('bluebookStudentEmail', email);
	        localStorage.setItem('bluebookStudentName', studentName);
	        localStorage.setItem('userName', studentName);
	        window.location.href = '../dashboard/index.html?v=20260604-verbal3';
	    });
	</script>
